<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>반배정 결과 조회</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏫</text></svg>">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            color: #1d1d1f;
        }
        .container {
            background-color: #ffffff;
            padding: 3rem 2.5rem;
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.05);
        }
        h2 { 
            margin-bottom: 2.5rem; 
            font-weight: 800;
            font-size: 1.6rem;
            letter-spacing: -0.5px;
            color: #111;
        }
        .loading-title { color: #999; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        input {
            width: 100%;
            padding: 16px;
            margin-bottom: 12px;
            background-color: #fff;
            border: 1px solid #d1d1d6;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 16px;
            color: #1d1d1f;
            outline: none;
            transition: all 0.2s ease;
        }
        input:focus { 
            border-color: #007aff; 
            box-shadow: 0 0 0 3px rgba(0,122,255,0.1);
        }
        ::placeholder { color: #8e8e93; font-weight: 400; }
        button {
            width: 100%;
            padding: 16px;
            background-color: #007aff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s, transform 0.1s;
        }
        button:active { transform: scale(0.98); background-color: #006edb; }
        button:disabled { background-color: #e5e5ea; color: #999; cursor: not-allowed; }
        
        #resultArea {
            margin-top: 30px;
            padding: 25px;
            background-color: #f9f9fb;
            border: 1px solid #ebebf0;
            border-radius: 12px;
            color: #007aff;
            font-weight: 700;
            display: none;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .class-detail {
            display: block;
            margin-top: 8px;
            font-size: 0.7em;
            color: #6e6e73;
            font-weight: 500;
        }
        .error { color: #ff3b30 !important; background-color: #fff5f5 !important; border-color: #ffcccc; }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="pageTitle" class="loading-title">준비 중...</h2>
        
        <datalist id="schoolOptions"></datalist>
        <input type="text" id="studentId" placeholder="출신 학교 조회 중..." inputmode="text" list="schoolOptions">
        <input type="text" id="studentName" placeholder="이름 조회 중...">
        <input type="password" id="birthDate" placeholder="생년월일 조회 중..." inputmode="numeric" maxlength="6">
        
        <button onclick="searchClass()" id="btnSearch">조회하기</button>
        <div id="resultArea"></div>
    </div>

    <script>
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzRA0k45igBaOu32ZGFxDEF5AFs9zJzbBsikXCJHRkrwRG9BhHJwjOHhHqPizCUH6PU0g/exec"; 

        window.onload = function() {
            fetch(GAS_URL, {
                method: "GET",
                redirect: "follow"
            })
            .then(response => response.json())
            .then(json => {
                if(json.result === "success") {
                    const titleElement = document.getElementById('pageTitle');
                    titleElement.innerText = json.sheetName + " 반배정 조회";
                    titleElement.classList.remove('loading-title');
    
                    if (json.headers) {
                        document.getElementById('studentId').placeholder = `${json.headers.col1} 검색 또는 선택`;
                        document.getElementById('studentName').placeholder = `${json.headers.col2} (예: 박서준)`;
                        document.getElementById('birthDate').placeholder = `${json.headers.col3} (예: 080101)`;
                    }
    
                    if (json.schoolList) {
                        const dataList = document.getElementById('schoolOptions');
                        json.schoolList.forEach(school => {
                            const option = document.createElement('option');
                            option.value = school;
                            dataList.appendChild(option);
                        });
                    }
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('pageTitle').innerText = "반배정 조회";
            });
        };

        function searchClass() {
            const id = document.getElementById('studentId').value.trim();
            const name = document.getElementById('studentName').value.trim();
            const birth = document.getElementById('birthDate').value.trim();
            const dataList = document.getElementById('schoolOptions');
            const options = Array.from(dataList.options).map(opt => opt.value);
            
            const btn = document.getElementById('btnSearch');
            const resultDiv = document.getElementById('resultArea');
            
            if(!id || !name || birth.length < 6) {
                alert("모든 정보를 정확히 입력해주세요.");
                return;
            }
    
            if(options.length > 0 && !options.includes(id)) {
                alert("목록에 있는 정확한 중학교 이름을 선택하거나 입력해주세요.");
                return;
            }

            btn.innerText = "조회 중...";
            btn.disabled = true;
            resultDiv.style.display = 'none';
            resultDiv.className = '';

            fetch(GAS_URL, {
                method: "POST",
                redirect: "follow",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({ studentId: id, studentName: name, birthDate: birth })
            })
            .then(response => response.json())
            .then(json => {
                resultDiv.style.display = 'block';
                if (json.result === "success") {
                    const newId = json.data.newClass;
                    let detailText = "";
                    
                    if (newId.length === 5 && !isNaN(newId)) {
                        const grade = newId.substring(0, 1);
                        const cls = parseInt(newId.substring(1, 3));
                        const num = parseInt(newId.substring(3, 5));
                        detailText = `${grade}학년 ${cls}반 ${num}번`;
                    }

                    resultDiv.innerHTML = `
                        <span style="color:#1d1d1f; font-weight:600;">${json.data.name} 학생</span><br>
                        <span style="font-size:2.2em; display:block; margin-top:12px; color:#007aff; letter-spacing:-1px;">
                            ${newId}
                        </span>
                        <span class="class-detail">${detailText}</span>
                    `;
                } else {
                    resultDiv.innerHTML = json.message;
                    resultDiv.classList.add('error');
                }
            })
            .catch(error => {
                resultDiv.style.display = 'block';
                resultDiv.innerText = "서버 통신 오류가 발생했습니다.";
                resultDiv.classList.add('error');
            })
            .finally(() => {
                btn.innerText = "조회하기";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
